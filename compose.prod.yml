services:
  sparelay:
    image: ghcr.io/sparelay/sparelay:latest
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_KEY: "${API_KEY:?Set API_KEY in the .env file}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
