<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" role="img">
  <title>How Sparelay routes a search</title>
  <desc>Your app sends one POST /search request to Sparelay. Sparelay applies the fallback order, cooldowns, and a timeout budget, then tries providers in order until one returns results. Every attempt is logged.</desc>

  <rect width="1400" height="600" fill="#ffffff"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- Your app -->
    <rect x="32" y="180" width="230" height="240" rx="16" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="60" y="222" font-size="22" font-weight="600" fill="#111111">Your app</text>

    <rect x="60" y="244" width="174" height="42" rx="9" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="76" y="271" font-size="17" fill="#444444">OpenWebUI</text>

    <rect x="60" y="294" width="174" height="42" rx="9" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="76" y="321" font-size="17" fill="#444444">LLM agents</text>

    <rect x="60" y="344" width="174" height="42" rx="9" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="76" y="371" font-size="17" fill="#444444">RAG pipeline</text>

    <!-- One endpoint -->
    <line x1="270" y1="300" x2="412" y2="300" stroke="#bfbfbf" stroke-width="2"/>
    <polygon points="410,294 424,300 410,306" fill="#bfbfbf"/>
    <text x="342" y="282" font-size="16" fill="#8a8a8a" text-anchor="middle">POST /search</text>

    <!-- Sparelay -->
    <rect x="430" y="90" width="460" height="420" rx="18" fill="#101010"/>
    <text x="470" y="164" font-size="30" font-weight="700" fill="#ffffff">Sparelay</text>
    <text x="470" y="192" font-size="16" fill="#8a8a8a">search gateway</text>

    <circle cx="476" cy="234" r="4" fill="#4A8F8C"/>
    <text x="492" y="240" font-size="18" fill="#d4d4d4">Fallback order</text>

    <circle cx="476" cy="290" r="4" fill="#4A8F8C"/>
    <text x="492" y="296" font-size="18" fill="#d4d4d4">Cooldown on 429</text>

    <circle cx="476" cy="346" r="4" fill="#4A8F8C"/>
    <text x="492" y="352" font-size="18" fill="#d4d4d4">Timeout budget</text>

    <line x1="470" y1="412" x2="850" y2="412" stroke="#262626"/>
    <text x="470" y="448" font-size="16" fill="#7a7a7a">logs · metrics · playground</text>

    <!-- Providers, in order -->
    <text x="950" y="145" font-size="15" fill="#9a9a9a">providers, tried in order</text>

    <line x1="890" y1="208" x2="924" y2="208" stroke="#bfbfbf" stroke-width="2"/>
    <polygon points="922,202 936,208 922,214" fill="#bfbfbf"/>

    <line x1="938" y1="208" x2="938" y2="392" stroke="#dcdcdc" stroke-width="2" stroke-dasharray="4 6"/>
    <line x1="938" y1="208" x2="948" y2="208" stroke="#dcdcdc" stroke-width="2"/>
    <line x1="938" y1="300" x2="948" y2="300" stroke="#dcdcdc" stroke-width="2"/>
    <line x1="938" y1="392" x2="948" y2="392" stroke="#dcdcdc" stroke-width="2"/>

    <rect x="950" y="170" width="420" height="76" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
    <circle cx="972" cy="208" r="5" fill="#d4d4d4"/>
    <text x="990" y="215" font-size="20" font-weight="600" fill="#111111">Exa</text>
    <text x="1344" y="215" font-size="16" fill="#a8a8a8" text-anchor="end">timeout</text>

    <rect x="950" y="262" width="420" height="76" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
    <circle cx="972" cy="300" r="5" fill="#d4d4d4"/>
    <text x="990" y="307" font-size="20" font-weight="600" fill="#111111">Brave</text>
    <text x="1344" y="307" font-size="16" fill="#a8a8a8" text-anchor="end">429 · cooldown</text>

    <rect x="950" y="354" width="420" height="76" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
    <circle cx="972" cy="392" r="5" fill="#4A8F8C"/>
    <text x="990" y="399" font-size="20" font-weight="600" fill="#111111">Tavily</text>
    <text x="1344" y="399" font-size="16" font-weight="600" fill="#4A8F8C" text-anchor="end">200 · 10 results</text>

    <text x="950" y="462" font-size="16" fill="#9a9a9a">Each failure moves to the next provider.</text>

  </g>
</svg>
